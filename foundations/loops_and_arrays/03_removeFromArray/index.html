<body>
    <script>
        const removeFromArray = function(arr, ...values){
            console.log(values)
            for(let i=0; i < arr.length; i++){
                if(values.includes(arr[i])){
                    arr.splice(i, 1)
                    i -=1;
                }
            }
            return arr
        }

        console.log(removeFromArray([1,2,4,3,4], 4))
    </script>
