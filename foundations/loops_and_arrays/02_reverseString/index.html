<body>
    <script>
    const reverseString = function(str) {
    const result = [];
    const split = str.split(" ")

    for(let i=0; i < split.length; i++){
        result.push(split[i].split("").reverse().join(""))
    }
    console.log(result.join(" "))
    

};
    
    reverseString("hello there")
    </script>
</body>
